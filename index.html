<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的聊天室</title>
</head>

<body>

<h1>我的聊天室</h1>

<div id="chat">讀取中...</div>

<script>

function loadMessages()
{
    fetch("messages.json")
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {

            var chat = document.getElementById("chat");

            chat.innerHTML = "";

            for (var i = 0; i < data.length; i++)
            {
                var div = document.createElement("div");

                div.innerHTML =
                    "<b>" + data[i].name + "</b>：" +
                    data[i].message;

                chat.appendChild(div);
            }
        })
        .catch(function(error) {

            document.getElementById("chat").innerHTML =
                "讀取訊息失敗";

            console.log(error);
        });
}

loadMessages();

</script>

</body>
</html>
